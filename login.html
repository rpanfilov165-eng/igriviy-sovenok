<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Игривый совёнок</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: linear-gradient(135deg, #f5e6a3 0%, #e8d580 30%, #d4c06a 70%, #c9b45a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-width: 450px; width: 100%; }
h1 { color: #5a4000; text-align: center; margin-bottom: 10px; }
.subtitle { color: #666; text-align: center; margin-bottom: 30px; }
.form-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
input:focus { outline: none; border-color: #f0c040; }
button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
button:hover { transform: translateY(-2px); }
.toggle-link { text-align: center; margin-top: 20px; color: #667eea; cursor: pointer; text-decoration: underline; font-size: 14px; }
.hidden { display: none; }
.error { color: #f44336; text-align: center; margin-top: 10px; font-size: 14px; }
.success { color: #4CAF50; text-align: center; margin-top: 10px; font-size: 14px; }
.back-link { text-align: center; margin-top: 15px; }
.back-link a { color: #8B7355; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="auth-container">
  <div id="loginForm">
    <h1>🔑 Вход</h1>
    <p class="subtitle">Войдите в свой аккаунт</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" required>
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="loginPassword" required>
    </div>
    <button onclick="doLogin()">Войти</button>
    <div class="toggle-link" onclick="showRegister()">Нет аккаунта? Зарегистрироваться</div>
    <div id="loginError" class="error"></div>
    <div class="back-link"><a href="index.html">← Вернуться на сайт</a></div>
  </div>

  <div id="registerForm" class="hidden">
    <h1>📝 Регистрация</h1>
    <p class="subtitle">Создайте новый аккаунт</p>
    <div class="form-group">
      <label>Имя *</label>
      <input type="text" id="regName" required>
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input type="email" id="regEmail" required>
    </div>
    <div class="form-group">
      <label>Телефон</label>
      <input type="tel" id="regPhone" placeholder="+7 (___) ___-__-__">
    </div>
    <div class="form-group">
      <label>Пароль (мин. 6 символов) *</label>
      <input type="password" id="regPassword" required>
    </div>
    <div class="form-group">
      <label>Повторите пароль *</label>
      <input type="password" id="regPasswordConfirm" required>
    </div>
    <button onclick="doRegister()">Зарегистрироваться</button>
    <div class="toggle-link" onclick="showLogin()">Уже есть аккаунт? Войти</div>
    <div id="regError" class="error"></div>
    <div id="regSuccess" class="success"></div>
    <div class="back-link"><a href="index.html">← Вернуться на сайт</a></div>
  </div>
</div>

<script>
function showRegister() {
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
  clearErrors();
}

function showLogin() {
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
  clearErrors();
}

function clearErrors() {
  document.getElementById('loginError').textContent = '';
  document.getElementById('regError').textContent = '';
  document.getElementById('regSuccess').textContent = '';
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorDiv = document.getElementById('loginError');
  errorDiv.textContent = '';

  if (!email || !password) {
    errorDiv.textContent = '❌ Заполните все поля';
    return;
  }

  const users = JSON.parse(localStorage.getItem('users') || '[]');
  const user = users.find(u => u.email === email && u.password === password);

  if (!user) {
    errorDiv.textContent = '❌ Неверный email или пароль';
    return;
  }

  user.lastLogin = new Date().toISOString();
  localStorage.setItem('users', JSON.stringify(users));

  const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
  const regUser = registeredUsers.find(u => u.email === email);
  if (regUser) {
    regUser.lastLogin = new Date().toISOString();
    localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
  }

  const currentUser = { name: user.name, email: user.email, phone: user.phone || '' };
  localStorage.setItem('currentUser', JSON.stringify(currentUser));

  alert('✅ Добро пожаловать, ' + user.name + '!');
  window.location.href = 'index.html';
}

function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;
  const errorDiv = document.getElementById('regError');
  const successDiv = document.getElementById('regSuccess');
  errorDiv.textContent = '';
  successDiv.textContent = '';

  if (!name || !email || !password) {
    errorDiv.textContent = '❌ Заполните обязательные поля (имя, email, пароль)';
    return;
  }

  if (password.length < 6) {
    errorDiv.textContent = '❌ Пароль должен быть не менее 6 символов';
    return;
  }

  if (password !== passwordConfirm) {
    errorDiv.textContent = '❌ Пароли не совпадают';
    return;
  }

  const users = JSON.parse(localStorage.getItem('users') || '[]');
  const existing = users.find(u => u.email === email);

  if (existing) {
    errorDiv.textContent = '❌ Пользователь с таким email уже существует';
    return;
  }

  const newUser = {
    name: name,
    email: email,
    phone: phone,
    password: password,
    registerDate: new Date().toISOString(),
    lastLogin: new Date().toISOString()
  };

  users.push(newUser);
  localStorage.setItem('users', JSON.stringify(users));

  // ===== СОХРАНЕНИЕ ДЛЯ АДМИНА =====
  const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
  registeredUsers.push({
    name: name,
    email: email,
    phone: phone,
    registerDate: new Date().toISOString(),
    lastLogin: new Date().toISOString()
  });
  localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
  // ===== КОНЕЦ СОХРАНЕНИЯ =====

  const currentUser = { name: name, email: email, phone: phone };
  localStorage.setItem('currentUser', JSON.stringify(currentUser));

  successDiv.textContent = '✅ Регистрация успешна! Переход на сайт...';
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 1000);
}
</script>
</body>
</html>
