// Функция открытия формы входа в админку
function openAdminLogin() {
    document.getElementById('formModal').classList.add('active');
    
    const formContent = `
        <h2>🔑 Вход в админ-панель</h2>
        <input type="text" id="adminUser" placeholder="Логин">
        <input type="password" id="adminPass" placeholder="Пароль">
        <div class="modal-actions">
            <button class="btn close-btn" onclick="closeModal('formModal')">Отмена</button>
            <button class="btn btn-purple" onclick="doAdminLogin()">Войти 🦉</button>
        </div>
    `;
    
    document.getElementById('formContent').innerHTML = formContent;
}

// Проверка логина/пароля администратора
async function doAdminLogin() {
    const adminUser = document.getElementById('adminUser').value.trim();
    const adminPass = document.getElementById('adminPass').value.trim();
    
    if (!adminUser || !adminPass) return alert('Заполните все поля!');
    
    // Пример простой проверки. Пароль можно хранить в отдельном объекте или базе данных.
    if (adminUser === 'admin' && adminPass === '777') {
        localStorage.setItem('isAdmin', 'true'); // Сохраняем статус администратора
        window.location.href = 'admin-dashboard.html'; // Перенаправляем на панель управления
    } else {
        alert('Неверный логин или пароль.');
    }
}

(function applySiteBackground(){
    const settings = DB.get('settings', {});
    const root = document.documentElement;
    if(settings.backgroundImage){
        if(settings.backgroundType === 'image'){
            root.style.setProperty('--site-bg-image', `url(${settings.backgroundImage})`);
            document.body.classList.add('custom-bg-image');
        } else {
            root.style.setProperty('--site-bg-gradient', settings.backgroundImage);
            document.body.classList.add('custom-bg-gradient');
        }
    }
    if(settings.headerColors){
        root.style.setProperty('--header-bg', `linear-gradient(135deg,${settings.headerColors.color1||'#2D1B4E'},${settings.headerColors.color2||'#673AB7'})`);
    }
})();

function saveAll(){

    DB.set('achievements',achievements);

}

// Проверка: купил ли пользователь этот материал
function isMaterialPurchased(materialId) {
    const current = DB.get('currentUser', null);
    if (!current) return false;
    // Бесплатные материалы доступны всем
    const m = materials.find(x => x.id == materialId);
    if (m && m.free) return true;
    // Проверяем оплаченные заказы
    return orders.some(o =>
        o.userId == current.id &&
        (o.status === 'paid' || o.status === 'sent' || o.status === 'done') &&
        o.items && o.items.some(i => i.productId == materialId)
    );
}

function renderSiteNav(){
    const nav = document.getElementById('siteNav');
    if(!nav) return;
    let html = '';
    siteTabs.forEach(tab => {
        let label = `${tab.icon} ${tab.label}`;
        if(tab.hasCount) label += ` <span id="compareCount">0</span>`;
        html += `<button onclick="${tab.action}">${label}</button>`;
    });
    // Заменяем ссылку на кнопку с обработчиком события
    html += '<button class="theme-btn" onclick="toggleTheme()">🌙</button>';
    html += '<button class="search-btn-header" onclick="openSearch()">🔍 Поиск</button>';
    html += '<button class="cart-btn" onclick="openCart()">🛒 <span class="cart-count" id="cartCount">0</span></button>';
    // Вот здесь добавляем нашу новую кнопку!
    html += '<button class="admin-link" onclick="openAdminLogin()">🔐 Админ</button>';
    nav.innerHTML = html;
}
