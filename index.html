<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🦉 Игривый совёнок</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',sans-serif; transition:all .3s; }
:root { --headerColor1:#2D1B4E; --headerColor2:#673AB7; --accent:#FFC107; --primary:#673AB7; --text:#2D1B4E; --card:rgba(255,255,255,0.97); --border:rgba(255,255,255,0.7); }
body { background: url('https://i.ibb.co/1tKFvpnC/1792417758.png') center/cover fixed !important; color:var(--text); min-height:100vh; padding-bottom:70px; position:relative; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; background:rgba(255,255,255,0.88); z-index:-1; pointer-events:none; }
body.custom-bg-image { background-image:var(--site-bg-image)!important; background-size:cover!important; background-position:center!important; background-attachment:fixed!important; }
body.custom-bg-gradient { background:var(--site-bg-gradient)!important; }
body.dark { --text:#f0e6ff; --card:rgba(30,20,60,0.95); --border:rgba(255,255,255,0.1); }
a { color:var(--primary); text-decoration:none; font-weight:700; }

header { background: var(--header-bg, linear-gradient(135deg,#2D1B4E,#673AB7)); color:#FFF; padding:12px 15px; box-shadow:0 4px 20px rgba(0,0,0,0.3); position:sticky; top:0; z-index:100; border-bottom:3px solid #FFC107; }
.header-inner { max-width:1400px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.logo { font-size:18px; font-weight:900; display:flex; align-items:center; gap:8px; cursor:pointer; color:#FFD54F; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
.logo-img { width:45px; height:45px; border-radius:50%; animation:float 3s ease-in-out infinite; box-shadow:0 4px 15px rgba(255,193,7,0.5); background:#fff; padding:3px; border:2px solid #FFC107; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.user-info { background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px; font-size:13px; font-weight:700; color:#FFD54F; border:1px solid rgba(255,255,255,0.3); white-space: nowrap; }
.user-info a { color:#FFD54F; font-weight:800; margin-left:5px; text-decoration:underline; }

nav { display:flex; flex-wrap:wrap; gap:6px; width:100%; justify-content:flex-start; }
nav button, nav a { background:linear-gradient(135deg,#FFD54F,#FFC107); color:#2D1B4E; border:none; padding:8px 12px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:800; text-decoration:none; display:inline-flex; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.2); white-space: nowrap; }
nav button:hover, nav a:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(255,193,7,0.6); }
.cart-btn { background:linear-gradient(135deg,#E53935,#EF5350)!important; color:#fff!important; }
.cart-count { position:absolute; top:-6px; right:-6px; background:#FFC107; color:#2D1B4E; border-radius:50%; width:20px; height:20px; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:900; border:2px solid #fff; }
.admin-link { background:linear-gradient(135deg,#9C27B0,#BA68C8)!important; color:#fff!important; }
.theme-btn { background:linear-gradient(135deg,#37474F,#546E7A)!important; color:#fff!important; }

.container { max-width:1400px; margin:20px auto; padding:0 15px; position:relative; z-index:1; }
.section { background:var(--card); backdrop-filter:blur(20px); padding:24px; margin-bottom:20px; border-radius:24px; box-shadow:0 8px 32px rgba(103,58,183,0.2); border:2px solid rgba(255,193,7,0.3); animation:fadeUp .5s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.section h2 { color:var(--text); margin-bottom:16px; padding-bottom:10px; border-bottom:3px solid transparent; border-image:linear-gradient(90deg,var(--accent),var(--primary)) 1; display:flex; align-items:center; gap:10px; font-size:20px; font-weight:900; }

.folders-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
.folder-card { background:linear-gradient(135deg,#FFF8E1,#FFE0B2); border:2px solid #FFC107; border-radius:16px; padding:20px; text-align:center; cursor:pointer; transition:all .3s; position:relative; overflow:hidden; }
.folder-card:hover { transform:translateY(-5px) scale(1.03); box-shadow:0 12px 24px rgba(255,193,7,0.4); border-color:#FF9800; }
.folder-card .folder-icon { font-size:48px; margin-bottom:10px; display:block; }
.folder-card .folder-name { font-size:14px; font-weight:800; color:#5D4037; }
.folder-card .folder-count { font-size:11px; color:#888; margin-top:5px; }

.materials-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.material-card { background:var(--card); border:2px solid rgba(255,193,7,0.3); border-radius:20px; padding:14px; transition:all .3s; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.material-card:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 12px 28px rgba(103,58,183,0.3); border-color:var(--accent); }
.material-card img { width:100%; height:140px; object-fit:cover; border-radius:14px; margin-bottom:10px; background:linear-gradient(135deg,#FFE0B2,#FFCC80); cursor:pointer; }
.material-card h3 { color:var(--text); font-size:15px; margin-bottom:6px; font-weight:800; flex-grow:1; }
.material-card p { font-size:12px; color:#4A3A5A; margin-bottom:6px; font-weight:600; }
.price { color:#D84315; font-weight:900; font-size:18px; }
.badge-free { position:absolute; top:10px; right:10px; background:linear-gradient(135deg,#4CAF50,#66BB6A); color:#fff; padding:4px 10px; border-radius:12px; font-size:10px; font-weight:800; }
.badge-paid { position:absolute; top:10px; right:10px; background:linear-gradient(135deg,#FF9800,#FFB74D); color:#fff; padding:4px 10px; border-radius:12px; font-size:10px; font-weight:800; }
.badge-hot { position:absolute; top:10px; left:10px; background:linear-gradient(135deg,#E53935,#EF5350); color:#fff; padding:4px 10px; border-radius:12px; font-size:10px; font-weight:800; }
.card-actions { display:flex; gap:6px; margin-top:auto; flex-wrap:wrap; }

.btn { background:linear-gradient(135deg,#FFD54F,#FFC107); color:#2D1B4E; border:none; padding:8px 14px; border-radius:16px; cursor:pointer; font-weight:800; font-size:12px; text-decoration:none; display:inline-block; box-shadow:0 3px 10px rgba(255,193,7,0.4); }
.btn:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(255,193,7,0.6); }
.btn-del { background:linear-gradient(135deg,#E53935,#EF5350); color:#fff; }
.btn-purple { background:linear-gradient(135deg,#673AB7,#7E57C2); color:#fff; }
.btn-small { padding:6px 10px; font-size:11px; }
.btn-fav { background:var(--card); border:2px solid #E53935; color:#E53935; }
.btn-fav.active { background:linear-gradient(135deg,#E53935,#EF5350); color:#fff; }

.breadcrumbs { background:linear-gradient(135deg,#FFF8E1,#FFE0B2); padding:12px 16px; border-radius:12px; margin-bottom:16px; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
.breadcrumbs a { color:var(--primary); cursor:pointer; }
.breadcrumbs a:hover { text-decoration:underline; }
.breadcrumbs .separator { color:#888; }

.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:1000; justify-content:center; align-items:center; padding:15px; }
.modal.active { display:flex; }
.modal-content { background:var(--card); padding:24px; border-radius:24px; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; border:2px solid var(--accent); }
.modal-content h2 { color:var(--text); margin-bottom:16px; font-weight:900; }
.modal-content input, .modal-content textarea, .modal-content select { width:100%; padding:10px; margin:6px 0; border:2px solid var(--border); border-radius:12px; font-size:13px; background:rgba(255,255,255,0.8); color:var(--text); font-weight:700; }
.modal-content textarea { min-height:75px; resize:vertical; }
.modal-actions { display:flex; justify-content:flex-end; margin-top:14px; gap:8px; flex-wrap:wrap; }
.close-btn { background:linear-gradient(135deg,#9E9E9E,#757575)!important; color:#fff!important; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; }
.stat-box { background:linear-gradient(135deg,#673AB7,#7E57C2); color:#fff; padding:16px; border-radius:18px; text-align:center; }
.stat-box .num { font-size:24px; font-weight:900; }
.stat-box .lbl { font-size:11px; opacity:0.9; font-weight:700; }

footer { background:linear-gradient(135deg,#2D1B4E,#4A2C6E); color:#FFF8E1; text-align:center; padding:20px; position:fixed; bottom:0; left:0; right:0; font-size:12px; z-index:50; font-weight:700; border-top:3px solid #FFC107; }
footer a { color:#FFD54F; font-weight:800; margin:0 6px; }

.page { display:none; }
.page.active { display:block; }
.welcome { text-align:center; padding:30px 20px; position:relative; overflow:hidden; border-radius:30px; background:linear-gradient(-45deg,#FFD54F,#FFC107,#FF9800,#FFB74D,#FFE082,#FFD54F); background-size:400% 400%; animation:rainbowShift 8s ease infinite; box-shadow:0 10px 40px rgba(255,193,7,0.5); border:3px solid #FFC107; }
@keyframes rainbowShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
.welcome h1 { color:#2D1B4E; font-size:28px; margin-bottom:10px; font-weight:900; text-shadow:2px 2px 4px rgba(255,255,255,0.8); }
.welcome p { color:#3E2723; font-size:15px; font-weight:700; text-shadow:1px 1px 2px rgba(255,255,255,0.6); }
.big-owl { width:200px; height:200px; display:block; margin:15px auto; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 8px 20px rgba(0,0,0,0.3)); border-radius:50%; background:transparent; padding:0; border:4px solid #fff; box-shadow:0 8px 30px rgba(255,193,7,0.6); }

@media (max-width:700px) { 
  .header-inner { flex-direction:column; align-items:flex-start; } 
  nav { overflow-x:auto; flex-wrap:nowrap; padding-bottom:5px; -webkit-overflow-scrolling: touch; }
  nav button, nav a { flex-shrink:0; }
  .welcome h1 { font-size:22px; } 
  .big-owl { width:160px; height:160px; } 
  .folders-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .materials-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="showSection('home')">
      <img src="logo.png" class="logo-img" alt="Игривый совёнок" draggable="false">
      <span>Игривый совёнок</span>
    </div>
    <div class="user-info" id="userInfo">👤 Гость | <a href="login.html">Войти</a></div>
    <nav id="siteNav">
      <button onclick="showSection('home')">🏠 Главная</button>
      <button onclick="showSection('catalogs')">📚 Каталоги</button>
      <button onclick="showSection('free')">🎁 Бесплатно</button>
      <a href="admin-login.html" class="admin-link">🔐 Админ</a>
    </nav>
  </div>
</header>

<div class="container">
  <div id="home" class="page active">
    <div class="section welcome">
      <img src="logo.png" class="big-owl" alt="Игривый совёнок" draggable="false">
      <h1>Добро пожаловать!</h1>
      <p>Уютный мир игр, пособий и знаний для маленьких совят 🌙✨</p>
    </div>
    <div class="section"><h2>📊 Статистика</h2><div class="stats" id="stats"></div></div>
  </div>
  
  <div id="catalogs" class="page"><div class="section"><h2>📚 Весь каталог</h2><div class="breadcrumbs" id="breadcrumbs-catalogs"></div><div class="folders-grid" id="folders-catalogs"></div><div class="materials-grid" id="materials-catalogs"></div></div></div>
  <div id="worksheets" class="page"><div class="section"><h2>📝 Рабочие листы</h2><div class="breadcrumbs" id="breadcrumbs-worksheets"></div><div class="folders-grid" id="folders-worksheets"></div><div class="materials-grid" id="materials-worksheets"></div></div></div>
  <div id="themes" class="page"><div class="section"><h2>🎨 Темы</h2><div class="breadcrumbs" id="breadcrumbs-themes"></div><div class="folders-grid" id="folders-themes"></div><div class="materials-grid" id="materials-themes"></div></div></div>
  <div id="letter-games" class="page"><div class="section"><h2>🔤 Игры с буквами</h2><div class="breadcrumbs" id="breadcrumbs-letter-games"></div><div class="folders-grid" id="folders-letter-games"></div><div class="materials-grid" id="materials-letter-games"></div></div></div>
  <div id="speech-games" class="page"><div class="section"><h2>🗣️ Логопедические игры</h2><div class="breadcrumbs" id="breadcrumbs-speech-games"></div><div class="folders-grid" id="folders-speech-games"></div><div class="materials-grid" id="materials-speech-games"></div></div></div>
  <div id="free" class="page"><div class="section"><h2>🎁 Бесплатно</h2><div class="breadcrumbs" id="breadcrumbs-free"></div><div class="folders-grid" id="folders-free"></div><div class="materials-grid" id="materials-free"></div></div></div>
</div>

<footer><p>🦉 © 2026 «Игривый совёнок» | <a href="login.html">Вход</a> | <a href="admin-login.html">Админ</a></p></footer>

<script>
const DB = { get(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}}, set(k,v){localStorage.setItem(k,JSON.stringify(v))} };

let folders = DB.get('folders', {
  'catalogs': [{id:1, name:'Развивающие игры', icon:'📚', items:[]}],
  'worksheets': [{id:1, name:'Прописи', icon:'✏️', items:[]}],
  'themes': [{id:1, name:'Животные', icon:'🦁', items:[]}],
  'letter-games': [{id:1, name:'Гласные', icon:'А', items:[]}],
  'speech-games': [{id:1, name:'Артикуляция', icon:'👄', items:[]}],
  'free': [{id:1, name:'Бесплатные материалы', icon:'🎁', items:[]}]
});
let materials = DB.get('materials', []);
let cart = DB.get('cart',[]);
let favorites = DB.get('favorites',[]);

let currentFolder = {};

function saveAll(){
  DB.set('folders',folders); DB.set('materials',materials); DB.set('cart',cart); DB.set('favorites',favorites);
}

function renderMaterialCard(m) {
  const isFav = favorites.includes(m.id);
  const badge = m.free ? '<span class="badge-free">🎁 Бесплатно</span>' : '<span class="badge-paid">💰 Платно</span>';
  const hotBadge = m.sale ? '<span class="badge-hot">🔥 Скидка</span>' : '';
  const priceHtml = m.free ? '<p class="price" style="color:#4CAF50">Бесплатно!</p>' : (m.sale && m.salePrice ? `<p class="price">${m.salePrice} ₽ <s style="font-size:12px;color:#999">${m.price}₽</s></p>` : `<p class="price">${m.price} ₽</p>`);
  
  return `<div class="material-card">${badge}${hotBadge}<img src="${m.img||''}" alt="" onclick="openMaterialModal(${m.id})"><h3 onclick="openMaterialModal(${m.id})" style="cursor:pointer">🖼️ ${m.name}</h3><p>${m.desc||''}</p>${priceHtml}<p style="font-size:11px;color:${m.stock>0?'#4CAF50':'#E53935'};font-weight:700;">${m.stock>0?'В наличии: '+m.stock+' шт.':'Нет в наличии'}</p><div class="card-actions">${!m.free&&m.stock>0?`<button class="btn btn-small" onclick="addToCart(${m.id})">🛒 В корзину</button>`:''}<button class="btn btn-fav btn-small ${isFav?'active':''}" onclick="toggleFavorite(${m.id})">${isFav?'❤️':'♡'}</button></div></div>`;
}

function openMaterialModal(id) {
  const m = materials.find(x => x.id == id); if(!m) return;
  const price = m.sale && m.salePrice ? m.salePrice : m.price;
  document.getElementById('productModalContent').innerHTML = `<h2>🖼️ ${m.name}</h2><img src="${m.img||''}" style="width:100%;border-radius:14px;margin-bottom:14px;"><p>${m.desc||''}</p><p><b>Наличие:</b> ${m.stock>0?m.stock+' шт.':'нет'}</p>${m.free?'<p class="price" style="color:#4CAF50;font-size:28px;margin:14px 0">Бесплатно! 🎁</p>':`<p class="price" style="font-size:28px;margin:14px 0">${price} ₽</p>`}<div class="modal-actions"><button class="btn close-btn" onclick="closeModal('productModal')">Закрыть</button>${!m.free&&m.stock>0?`<button class="btn btn-purple" onclick="addToCart(${m.id});closeModal('productModal')">🛒 В корзину</button>`:''}</div>`;
  openModal('productModal');
}

function showSection(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); }
function openModal(id){document.getElementById('formModal').classList.add('active');document.getElementById('productModal').classList.add('active');}
function closeModal(id){document.getElementById('formModal').classList.remove('active');document.getElementById('productModal').classList.remove('active');}
function addToCart(productId){const m=materials.find(x=>x.id==productId);if(!m)return;cart.push({productId,qty:1});saveAll();updateCartCount();alert(`«${m.name}» в корзине 🛒`);}
function updateCartCount(){document.getElementById('cartCount').textContent=cart.length;}
function toggleFavorite(productId){const idx=favorites.indexOf(productId);if(idx>=0)favorites.splice(idx,1);else favorites.push(productId);saveAll();renderAll();}

function renderAll(){
  document.getElementById('stats').innerHTML = `<div class="stat-box"><div class="num">${Object.keys(folders).length}</div><div class="lbl">📚 Разделов</div></div><div class="stat-box"><div class="num">${materials.length}</div><div class="lbl">🛍 Материалов</div></div>`;
  
  ['catalogs','worksheets','themes','letter-games','speech-games','free'].forEach(sectionId => {
    const fDiv = document.getElementById(`folders-${sectionId}`);
    const mDiv = document.getElementById(`materials-${sectionId}`);
    if(!fDiv || !mDiv) return;
    const folderList = folders[sectionId] || [];
    const currentFolderId = window.currentFolder ? window.currentFolder[sectionId] : null;
    
    if(currentFolderId) {
      fDiv.style.display = 'none';
      const folder = folderList.find(f => f.id == currentFolderId);
      const folderMaterials = folder ? folder.items.map(itemId => materials.find(m => m.id == itemId)).filter(Boolean) : [];
      mDiv.innerHTML = folderMaterials.length ? folderMaterials.map(m => renderMaterialCard(m)).join('') : '<p style="text-align:center;padding:20px;">В этой папке пока нет материалов</p>';
    } else {
      fDiv.style.display = 'grid';
      mDiv.innerHTML = '';
      fDiv.innerHTML = folderList.map(f => `<div class="folder-card" onclick="window.currentFolder=window.currentFolder||{};window.currentFolder['${sectionId}']=${f.id};renderAll();"><span class="folder-icon">${f.icon}</span><div class="folder-name">${f.name}</div><div class="folder-count">${f.items.length} материалов</div></div>`).join('');
    }
  });
}

window.currentFolder = {};
renderAll();
</script>

<!-- Модальное окно для товара -->
<div class="modal" id="productModal"><div class="modal-content" id="productModalContent"></div></div>
</body>
</html>
