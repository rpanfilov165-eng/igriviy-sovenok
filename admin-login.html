<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🔐 Админ — Игривый совёнок</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',sans-serif; transition:all .3s; }
body { background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-wrap { background:rgba(255,248,225,0.98); backdrop-filter:blur(20px); border-radius:24px; padding:30px; max-width:1200px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5); border:3px solid #FFC107; text-align:center; max-height:95vh; overflow-y:auto; }
.owl-big { width:110px; height:110px; display:block; margin:0 auto 10px; animation:float 3s ease-in-out infinite; border-radius:50%; border:3px solid #FFC107; background:#fff; padding:5px; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
h1 { color:#2D1B4E; margin-bottom:5px; font-size:26px; font-weight:900; background:linear-gradient(135deg,#673AB7,#FFC107); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.subtitle { color:#673AB7; margin-bottom:20px; font-size:14px; font-weight:700; }
.form-group { margin-bottom:12px; text-align:left; }
.form-group label { display:block; color:#2D1B4E; font-weight:700; margin-bottom:5px; font-size:13px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:11px; border:2px solid #FFE0B2; border-radius:12px; font-size:13px; background:#fff; font-weight:600; }
.form-group input:focus, .form-group textarea:focus { outline:none; border-color:#FFC107; box-shadow:0 0 0 3px rgba(255,193,7,0.2); }
.form-group textarea { min-height:70px; resize:vertical; }
.btn-submit { width:100%; background:linear-gradient(135deg,#673AB7,#7E57C2); color:#fff; border:none; padding:13px; border-radius:14px; font-size:15px; font-weight:800; cursor:pointer; margin-top:10px; box-shadow:0 4px 14px rgba(103,58,183,0.4); }
.msg { padding:10px; border-radius:10px; margin-bottom:12px; font-size:13px; display:none; font-weight:600; }
.msg.error { background:#FFEBEE; color:#C62828; display:block; }
.msg.success { background:#E8F5E9; color:#2E7D32; display:block; }
.admin-panel { display:none; background:#fff; padding:20px; border-radius:18px; margin-top:12px; text-align:left; max-height:80vh; overflow-y:auto; }
.admin-panel h3 { color:#2D1B4E; margin-bottom:12px; padding-bottom:8px; border-bottom:3px solid transparent; border-image:linear-gradient(90deg,#FFC107,#673AB7) 1; font-size:18px; font-weight:800; }
.admin-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px; }
.admin-tabs button { background:linear-gradient(135deg,#FFE0B2,#FFCC80); border:none; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700; color:#5D4037; font-size:11px; }
.admin-tabs button:hover { transform:translateY(-2px); }
.admin-tabs button.active { background:linear-gradient(135deg,#673AB7,#7E57C2); color:#fff; box-shadow:0 4px 12px rgba(103,58,183,0.4); }
.admin-section { display:none; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.admin-section.active { display:block; }
.item-row { background:linear-gradient(135deg,#FFF8E1,#FFE0B2); padding:12px; border-radius:10px; margin:8px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; border-left:4px solid #673AB7; }
.item-info { flex:1; min-width:200px; }
.item-info h4 { color:#5D4037; margin-bottom:5px; font-weight:700; }
.item-actions { display:flex; gap:5px; flex-wrap:wrap; }
.btn { background:linear-gradient(135deg,#FFD54F,#FFC107); color:#3E2723; border:none; padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:700; font-size:12px; margin:2px; }
.btn:hover { transform:translateY(-2px); }
.btn-del { background:linear-gradient(135deg,#E53935,#EF5350); color:#fff; }
.btn-edit { background:linear-gradient(135deg,#43A047,#66BB6A); color:#fff; }
.btn-purple { background:linear-gradient(135deg,#673AB7,#7E57C2); color:#fff; }
.btn-add { background:linear-gradient(135deg,#4CAF50,#66BB6A); color:#fff; padding:10px 18px; font-size:13px; margin-bottom:15px; }
.nav-links { margin-top:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.nav-links a { background:linear-gradient(135deg,#FFD54F,#FFC107); color:#3E2723; padding:8px 14px; border-radius:12px; text-decoration:none; font-weight:700; font-size:12px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
.stat-box { background:linear-gradient(135deg,#673AB7,#7E57C2); color:#fff; padding:14px; border-radius:14px; text-align:center; }
.stat-box .num { font-size:24px; font-weight:800; }
.stat-box .lbl { font-size:11px; opacity:0.9; font-weight:600; }
.bg-box { background:linear-gradient(135deg,#FFF8E1,#FFE0B2); padding:20px; border-radius:14px; margin-bottom:16px; border:2px dashed #FFC107; }
.bg-box h4 { margin-top:0; color:#5D4037; }
.empty-state { text-align:center; padding:30px; color:#999; font-style:italic; }
@media (max-width:700px) { .admin-tabs button { font-size:10px; padding:6px 8px; } .login-wrap { padding:18px; } .item-row { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<div class="login-wrap">
  <img src="logo.png" class="owl-big" alt="Игривый совёнок">
  <h1>Админ-панель</h1>
  <p class="subtitle">Управление сайтом 🔐</p>
  <div id="msgBox" class="msg"></div>
  
  <div id="loginBlock">
    <form onsubmit="doLogin(event)">
      <div class="form-group"><label>👤 Логин</label><input type="text" id="loginUser" required placeholder="admin"></div>
      <div class="form-group"><label>🔒 Пароль</label><input type="password" id="loginPass" required placeholder="Введите пароль"></div>
      <button type="submit" class="btn-submit">Войти 🦉</button>
    </form>
  </div>

  <div class="admin-panel" id="adminPanel">
    <h3>⚙️ Управление сайтом</h3>
    <div class="admin-tabs" id="adminTabs">
      <div class="tab-wrapper"><button class="active" onclick="showTab('aDashboard',this)" data-tab="aDashboard">📊 Дашборд</button></div>
      <div class="tab-wrapper"><button onclick="showTab('aCatalogs',this)" data-tab="aCatalogs">📚 Весь каталог</button></div>
      <div class="tab-wrapper"><button onclick="showTab('aWorksheets',this)" data-tab="aWorksheets">📝 Рабочие листы</button></div>
      <div class="tab-wrapper"><button onclick="showTab('aThemes',this)" data-tab="aThemes">🎨 Темы</button></div>
      <div class="tab-wrapper"><button onclick="showTab('aLetterGames',this)" data-tab="aLetterGames">🔤 Игры с буквами</button></div>
      <div class="tab-wrapper"><button onclick="showTab('aSpeechGames',this)" data-tab="aSpeechGames">🗣️ Логопедические</button></div>
      <div class="tab-wrapper"><button onclick="showTab('aFree',this)" data-tab="aFree">🎁 Бесплатно</button></div>
    </div>

    <div id="aDashboard" class="admin-section active"><h3>📊 Статистика</h3><div class="stats"><div class="stat-box"><div class="num" id="statMaterials">0</div><div class="lbl">Материалов</div></div><div class="stat-box"><div class="num" id="statFolders">0</div><div class="lbl">Папок</div></div></div></div>

    <div id="aCatalogs" class="admin-section"><h3>📚 Весь каталог</h3><button class="btn btn-add" onclick="openFolderModal('catalogs')">➕ Добавить папку</button><div id="adminFolders-catalogs"></div></div>
    <div id="aWorksheets" class="admin-section"><h3>📝 Рабочие листы</h3><button class="btn btn-add" onclick="openFolderModal('worksheets')">➕ Добавить папку</button><div id="adminFolders-worksheets"></div></div>
    <div id="aThemes" class="admin-section"><h3>🎨 Темы</h3><button class="btn btn-add" onclick="openFolderModal('themes')">➕ Добавить папку</button><div id="adminFolders-themes"></div></div>
    <div id="aLetterGames" class="admin-section"><h3>🔤 Игры с буквами</h3><button class="btn btn-add" onclick="openFolderModal('letter-games')">➕ Добавить папку</button><div id="adminFolders-letter-games"></div></div>
    <div id="aSpeechGames" class="admin-section"><h3>🗣️ Логопедические игры</h3><button class="btn btn-add" onclick="openFolderModal('speech-games')">➕ Добавить папку</button><div id="adminFolders-speech-games"></div></div>
    <div id="aFree" class="admin-section"><h3>🎁 Бесплатно</h3><button class="btn btn-add" onclick="openFolderModal('free')">➕ Добавить папку</button><div id="adminFolders-free"></div></div>
  </div>
  <div class="nav-links"><a href="index.html">🏠 На сайт</a></div>
</div>

<div class="form-modal" id="formModal"><div class="form-modal-content" id="formContent"></div></div>

<script>
const DB = { get(k,def){try{return JSON.parse(localStorage.getItem(k))||def}catch(e){return def}}, set(k,v){localStorage.setItem(k,JSON.stringify(v))} };

let admin = DB.get('admin',{login:'admin',password:'777'});
let folders = DB.get('folders', {
  'catalogs': [{id:1, name:'Развивающие игры', icon:'📚', items:[]}],
  'worksheets': [{id:1, name:'Прописи', icon:'✏️', items:[]}],
  'themes': [{id:1, name:'Животные', icon:'🦁', items:[]}],
  'letter-games': [{id:1, name:'Гласные', icon:'А', items:[]}],
  'speech-games': [{id:1, name:'Артикуляция', icon:'👄', items:[]}],
  'free': [{id:1, name:'Бесплатные материалы', icon:'🎁', items:[]}]
});
let materials = DB.get('materials', []);

function saveAll(){
  DB.set('folders',folders);
  DB.set('materials',materials);
}
function showMsg(text,type='error'){const box=document.getElementById('msgBox');box.textContent=text;box.className='msg '+type;setTimeout(()=>{box.className='msg';},3000);}

async function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPass').value;
  if (u === admin.login && p === admin.password) {
    sessionStorage.setItem('isAdmin', '1');
    document.getElementById('loginBlock').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    renderAdmin();
  } else {
    showMsg('❌ Неверный логин или пароль', 'error');
  }
}

function showTab(id, btn) {
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
function openForm(){document.getElementById('formModal').classList.add('active');}
function closeForm(){document.getElementById('formModal').classList.remove('active');}

// === УПРАВЛЕНИЕ ПАПКАМИ ===
function openFolderModal(sectionId, folderId) {
  const folder = folderId ? folders[sectionId].find(f => f.id == folderId) : {name:'', icon:'📁', items:[]};
  document.getElementById('formContent').innerHTML = `
    <h2>${folderId ? '✏️ Редактировать папку' : '➕ Новая папка'}</h2>
    <div class="form-group"><label>📁 Название папки *</label><input id="f_folderName" value="${folder.name}"></div>
    <div class="form-group"><label>🎨 Иконка (эмодзи)</label><input id="f_folderIcon" value="${folder.icon}" maxlength="4"></div>
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="closeForm()">Отмена</button>
      <button class="btn btn-purple" onclick="saveFolder('${sectionId}', ${folderId||0})">💾 Сохранить</button>
    </div>`;
  openForm();
}

function saveFolder(sectionId, folderId) {
  const name = document.getElementById('f_folderName').value.trim();
  const icon = document.getElementById('f_folderIcon').value.trim() || '📁';
  if(!name) return alert('⚠️ Введите название');
  if(folderId) {
    const folder = folders[sectionId].find(f => f.id == folderId);
    if(folder) { folder.name = name; folder.icon = icon; }
  } else {
    folders[sectionId].push({id: Date.now(), name, icon, items:[]});
  }
  saveAll(); closeForm(); renderAdmin(); showMsg('✅ Папка сохранена!', 'success');
}

function deleteFolder(sectionId, folderId) {
  if(!confirm('Удалить папку и все материалы в ней?')) return;
  const folder = folders[sectionId].find(f => f.id == folderId);
  if(folder) {
    folder.items.forEach(itemId => { materials = materials.filter(m => m.id != itemId); });
    folders[sectionId] = folders[sectionId].filter(f => f.id != folderId);
  }
  saveAll(); renderAdmin(); showMsg('🗑 Папка удалена', 'success');
}

// === УПРАВЛЕНИЕ МАТЕРИАЛАМИ (Возвращено к простой версии) ===
function openMaterialModal(sectionId, folderId, materialId) {
  const m = materialId ? materials.find(x => x.id == materialId) : {name:'', desc:'', price:0, free:false, stock:0, img:'', sale:false, salePrice:0};
  document.getElementById('formContent').innerHTML = `
    <h2>${materialId ? '✏️ Редактировать' : '➕ Новый материал'}</h2>
    <div class="form-group"><label>📌 Название *</label><input id="m_name" value="${m.name}"></div>
    <div class="form-group"><label>📝 Описание</label><textarea id="m_desc">${m.desc||''}</textarea></div>
    <div class="form-group"><label>🖼️ URL картинки *</label><input id="m_img" value="${m.img||''}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label>💵 Цена (₽)</label><input id="m_price" type="number" value="${m.price}" min="0"></div>
      <div class="form-group"><label>📦 Остаток</label><input id="m_stock" type="number" value="${m.stock||0}" min="0"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group"><label><input type="checkbox" id="m_free" ${m.free?'checked':''}> 🎁 Бесплатный</label></div>
      <div class="form-group"><label><input type="checkbox" id="m_sale" ${m.sale?'checked':''}> 🔥 Скидка</label></div>
    </div>
    <div class="form-group"><label>💸 Цена со скидкой</label><input id="m_salePrice" type="number" value="${m.salePrice||0}" min="0"></div>
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="closeForm()">Отмена</button>
      <button class="btn btn-purple" onclick="saveMaterial('${sectionId}', ${folderId}, ${materialId||0})">💾 Сохранить</button>
    </div>`;
  openForm();
}

function saveMaterial(sectionId, folderId, materialId) {
  const name = document.getElementById('m_name').value.trim();
  const desc = document.getElementById('m_desc').value.trim();
  const price = +document.getElementById('m_price').value;
  const stock = +document.getElementById('m_stock').value;
  const free = document.getElementById('m_free').checked;
  const sale = document.getElementById('m_sale').checked;
  const salePrice = +document.getElementById('m_salePrice').value;
  const img = document.getElementById('m_img').value.trim();
  
  if(!name) return alert('⚠️ Введите название');
  if(!img) return alert('⚠️ Добавьте URL картинки');
  
  if(materialId) {
    const m = materials.find(x => x.id == materialId);
    if(m) Object.assign(m, {name, desc, price, stock, free, sale, salePrice, img});
  } else {
    const newM = {id: Date.now(), name, desc, price, stock, free, sale, salePrice, img};
    materials.push(newM);
    const folder = folders[sectionId].find(f => f.id == folderId);
    if(folder) folder.items.push(newM.id);
  }
  saveAll(); closeForm(); renderAdmin(); showMsg('✅ Материал сохранён!', 'success');
}

function deleteMaterial(sectionId, folderId, materialId) {
  if(!confirm('Удалить материал?')) return;
  const folder = folders[sectionId].find(f => f.id == folderId);
  if(folder) folder.items = folder.items.filter(id => id != materialId);
  materials = materials.filter(m => m.id != materialId);
  saveAll(); renderAdmin(); showMsg('🗑 Удалено', 'success');
}

// === РЕНДЕР ===
function renderAdmin() {
  document.getElementById('statMaterials').textContent = materials.length;
  const totalFolders = Object.values(folders).reduce((sum, arr) => sum + arr.length, 0);
  document.getElementById('statFolders').textContent = totalFolders;

  ['catalogs','worksheets','themes','letter-games','speech-games','free'].forEach(sectionId => {
    const div = document.getElementById(`adminFolders-${sectionId}`);
    if(!div) return;
    const folderList = folders[sectionId] || [];
    div.innerHTML = folderList.length ? folderList.map(f => {
      const mats = f.items.map(id => materials.find(m => m.id == id)).filter(Boolean);
      return `<div class="item-row" style="flex-direction:column;align-items:flex-start;">
        <div style="display:flex;justify-content:space-between;width:100%;margin-bottom:10px;">
          <div class="item-info"><h4>${f.icon} ${f.name}</h4><p>Материалов: <b>${mats.length}</b></p></div>
          <div class="item-actions">
            <button class="btn btn-edit" onclick="openFolderModal('${sectionId}', ${f.id})">✏️</button>
            <button class="btn btn-del" onclick="deleteFolder('${sectionId}', ${f.id})">🗑</button>
          </div>
        </div>
        <div style="width:100%;background:#fff;padding:10px;border-radius:8px;border:1px solid #FFE0B2;">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <h4 style="margin:0;font-size:13px;">📂 Материалы:</h4>
            <button class="btn btn-add" onclick="openMaterialModal('${sectionId}', ${f.id})" style="padding:4px 10px;font-size:11px;">➕ Добавить</button>
          </div>
          ${mats.length ? mats.map(m => `
            <div style="display:flex;justify-content:space-between;padding:6px;background:#FFF8E1;border-radius:6px;margin-bottom:4px;">
              <div style="flex:1;"><h4 style="margin:0;font-size:12px;">🖼️ ${m.name}</h4><p style="margin:2px 0 0;font-size:11px;color:#666;">${m.price+'₽'} | Ост: ${m.stock}</p></div>
              <div class="item-actions">
                <button class="btn btn-edit" onclick="openMaterialModal('${sectionId}', ${f.id}, ${m.id})" style="padding:2px 6px;font-size:10px;">✏️</button>
                <button class="btn btn-del" onclick="deleteMaterial('${sectionId}', ${f.id}, ${m.id})" style="padding:2px 6px;font-size:10px;">🗑</button>
              </div>
            </div>
          `).join('') : '<p style="font-size:11px;color:#888;text-align:center;">Нет материалов</p>'}
        </div>
      </div>`;
    }).join('') : '<div class="empty-state">Нет папок. Нажмите "➕ Добавить папку"</div>';
  });
}

if(sessionStorage.getItem('isAdmin')=='1'){document.getElementById('loginBlock').style.display='none';document.getElementById('adminPanel').style.display='block';renderAdmin();}
</script>
</body>
</html>
