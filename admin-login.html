<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🔐 Админ — Игривый совёнок</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="logo.png">
<!-- Подключение шрифтов -->
<link href="https://fonts.googleapis.com/css2?
family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* {
 margin: 0;
 padding: 0; box-sizing: border-box;
 font-family: 'Nunito', sans-serif;
 transition: all .3s ease-in-out;
 }
body {
  background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeInBody 1s forwards;
}

@keyframes fadeInBody {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Основная обёртка */
.login-wrap {
  background: rgba(255,248,225,0.98);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 30px;
  max-width: 1200px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border: 3px solid #FFC107;
  text-align: center;
  max-height: 95vh;
  overflow-y: auto;
  position: relative;
}

/* Логотип с эффектом парения */
.owl-big {
  width: 110px;
  height: 110px;
  display: block;
  margin: 0 auto 10px;
  animation: float 3s ease-in-out infinite;
  border-radius: 50%;
  border: 3px solid #FFC107;
  background: #fff;
  padding: 5px;
  filter: drop-shadow(0 0 10px rgba(255,193,7,0.5));
}

@keyframes float {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

h1 {
  color: #2D1B4E;
  margin-bottom: 5px;
  font-size: 26px;
  font-weight: 900;
  background: linear-gradient(135deg,#673AB7,#FFC107);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 1px;
}

.subtitle {
  color: #673AB7;
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 700;
}

/* Форма входа */
.form-group {
  margin-bottom: 12px;
  text-align: left;
}

.form-group label {
  display: block;
  color: #2D1B4E;
  font-weight: 700;
  margin-bottom: 5px;
  font-size: 13px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 11px;
  border: 2px solid #FFE0B2;
  border-radius: 12px;
  font-size: 13px;
  background: #fff;
  font-weight: 600;
  outline: none !important;
  transition: border-color .3s, box-shadow .3s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: #FFC107;
  box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
}

.btn-submit {
  width: 100%;
  background: linear-gradient(135deg,#673AB7,#7E57C2);
  color: #fff;
  border: none;
  padding: 13px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 4px 14px rgba(103,58,183,0.4);
  transition: transform .2s, box-shadow .2s;
}

.btn-submit:hover {
  transform: scale(1.02);
  box-shadow: 0 6px 20px rgba(103,58,183,0.6);
}

/* Сообщения */
.msg {
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 13px;
  display: none;
  font-weight: 600;
  animation: msgFadeIn .3s forwards;
}

@keyframes msgFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.error {
  background: #FFEBEE;
  color: #C62828;
  display: block;
}

.msg.success {
  background: #E8F5E9;
  color: #2E7D32;
  display: block;
}

/* Панель администратора */
.admin-panel {
  display: none;
  background: #fff;
  padding: 20px;
  border-radius: 18px;
  margin-top: 12px;
  text-align: left;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.admin-panel.active {
  display: block;
}

.admin-panel h3 {
  color: #2D1B4E;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 3px solid transparent;
  border-image: linear-gradient(90deg,#FFC107,#673AB7) 1;
  font-size: 18px;
  font-weight: 800;
  position: relative;
}

.admin-panel h3::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: -1;
  background: linear-gradient(to right, rgba(255,193,7,0.1), rgba(103,58,183,0.1));
  border-radius: inherit;
}

/* Вкладки */
.admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}

.admin-tabs button {
  background: linear-gradient(135deg,#FFE0B2,#FFCC80);
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  color: #5D4037;
  font-size: 11px;
  transition: transform .2s, box-shadow .2s;
}

.admin-tabs button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(103,58,183,0.2);
}

.admin-tabs button.active {
  background: linear-gradient(135deg,#673AB7,#7E57C2);
  color: #fff;
  box-shadow: 0 4px 12px rgba(103,58,183,0.4);
}

.admin-section {
  display: none;
  animation: fadeInSection .3s forwards;
}

@keyframes fadeInSection {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.admin-section.active {
  display: block;
}

/* Элементы списка */
.item-row {
  background: linear-gradient(135deg,#FFF8E1,#FFE0B2);
  padding: 12px;
  border-radius: 10px;
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  border-left: 4px solid #673AB7;
  box-shadow: inset 0 -1px 0 rgba(0,0,0,0.05);
}

.item-info h4 {
  color: #5D4037;
  margin-bottom: 5px;
  font-weight: 700;
}

.btn-edit {
  background: linear-gradient(135deg,#4CAF50,#66BB6A);
  color: #fff;
}

.btn-del {
  background: linear-gradient(135deg,#E53935,#EF5350);
  color: #fff;
}

.btn-add {
  background: linear-gradient(135deg,#4CAF50,#66BB6A);
  color: #fff;
  padding: 10px 18px;
  font-size: 13px;
  margin-bottom: 15px;
}

.nav-links a {
  background: linear-gradient(135deg,#FFD54F,#FFC107);
  color: #3E2723;
  padding: 8px 14px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 700;
  font-size: 12px;
  transition: transform .2s;
}

.nav-links a:hover {
  transform: scale(1.02);
}

/* Статистика */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.stat-box {
  background: linear-gradient(135deg,#673AB7,#7E57C2);
  color: #fff;
  padding: 14px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 4px 14px rgba(103,58,183,0.4);
}

.stat-box .num {
  font-size: 24px;
  font-weight: 800;
}

.stat-box .lbl {
  font-size: 11px;
  opacity: 0.9;
  font-weight: 600;
}

/* Модальное окно */
.form-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 15px;
  animation: modalFadeIn .3s forwards;
}

@keyframes modalFadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.form-modal.active {
  display: flex;
}

.form-modal-content {
  background: rgba(255,248,225,0.98);
  padding: 24px;
  border-radius: 20px;
  width: 100%;
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
  border: 2px solid #FFC107;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Палитра эмодзи */
.emoji-palette {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  margin-top: 8px;
  background: #fff;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid #FFE0B2;
  max-height: 180px;
  overflow-y: auto;
}

.emoji-item {
  font-size: 22px;
  text-align: center;
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: all .2s;
}

.emoji-item:hover {
  background: #FFC107;
  transform: scale(1.2);
}

.emoji-item.selected {
  background: #673AB7;
  border-radius: 50%;
}

/* Типы материалов */
.type-selector {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin: 8px 0;
}

.type-option {
  background: #fff;
  border: 2px solid #FFE0B2;
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  font-weight: 700;
  font-size: 12px;
  color: #5D4037;
}

.type-option:hover {
  border-color: #FFC107;
  transform: translateY(-2px);
}

.type-option.active {
  background: linear-gradient(135deg,#673AB7,#7E57C2);
  color: #fff;
  border-color: #673AB7;
}

/* Медиа-запросы */
@media (max-width: 700px) {
  .admin-tabs button {
    font-size: 10px;
    padding: 6px 8px;
  }
  .login-wrap {
    padding: 18px;
  }
  .item-row {
    flex-direction: column;
    align-items: flex-start;
  }
  .emoji-palette {
    grid-template-columns: repeat(8, 1fr);
  }
  .type-selector {
    grid-template-columns: 1fr;
  }
}
