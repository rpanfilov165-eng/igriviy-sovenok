<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🔐 Вход в админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFC107;
            --accent: #673AB7;
            --text: #2D1B4E;
            --card: rgba(255,255,255,0.97);
            --border: rgba(255,255,255,0.7);
        }
        
        body {
            background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            font-family: 'Nunito', sans-serif;
        }
        
        .login-wrap {
            max-width: 400px;
            width: 100%;
            background: var(--card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 900;
            color: var(--text);
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.8);
            color: var(--text);
            font-weight: 700;
            transition: all .2s;
        }
        
        input:focus {
            outline: none;
            transform: scale(1.02);
        }
        
        button.btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 900;
            font-size: 14px;
            transition: all .2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg,var(--primary),var(--accent));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255,193,7,0.6);
        }
        
        p.error {
            color: #E53935;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-wrap">
    <h1>🔐 Вход в админ-панель</h1>
    <input type="text" id="adminUser" placeholder="Логин" autofocus>
    <input type="password" id="adminPass" placeholder="Пароль">
    <p id="errorMsg" class="error" style="display:none;"></p>
    <button class="btn btn-primary" onclick="doAdminLogin()">Войти 🦉</button>
</div>

<script>
    async function doAdminLogin() {
        const adminUser = document.getElementById('adminUser').value.trim();
        const adminPass = document.getElementById('adminPass').value.trim();
        const errorEl = document.getElementById('errorMsg');
    
        errorEl.textContent = '';
        errorEl.style.display = 'none';
    
        if (!adminUser || !adminPass) {
            errorEl.textContent = 'Заполните все поля!';
            errorEl.style.display = 'block';
            return;
        }
    
        // Простая проверка логина и пароля
        if (adminUser !== 'admin' || adminPass !== '777') {
            errorEl.textContent = 'Неверный логин или пароль.';
            errorEl.style.display = 'block';
            return;
        }
    
        // Если всё верно - сохраняем флаг администратора и переходим на dashboard
        localStorage.setItem('isAdmin', 'true');
        window.location.href = 'admin-dashboard.html';
    }
</script>

</body>
</html>
